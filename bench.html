<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>廖化 · 元儉 // 地健星</title>
<style>
  :root { --gold:#d4a84b; --gold2:#f0d78c; --bg:#0b0a08; --ink:#f3e6c8; --dim:#8a7a5c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background: var(--bg); color:var(--ink); font-family:"Songti SC","Noto Serif SC","PMingLiU",serif; min-height:100vh; padding:28px 16px 50px; }
  .wrap { max-width:760px; margin:0 auto; }
  .back { color:var(--gold2); text-decoration:none; font-size:12px; letter-spacing:.15em; }
  .panel { margin-top:14px; background: linear-gradient(165deg,#121412,#0f0d0a 70%); border:1px solid rgba(255,255,255,0.18); padding:26px 22px 30px; position:relative; overflow:hidden; }
  .panel::before { content:"穩"; position:absolute; right:-8px; top:-16px; font-size:140px; color:rgba(255,255,255,0.04); line-height:1; font-weight:700; }
  .seal { display:inline-block; border:2px solid #aaa; color:#ccc; width:40px; height:40px; line-height:36px; text-align:center; font-size:16px; }
  .top { display:flex; justify-content:space-between; align-items:flex-start; margin-top:10px; }
  .pwr { font-size:64px; font-weight:700; color:#bbb; line-height:1; }
  .star-tag { font-size:12px; letter-spacing:.2em; color:#aaa; border:1px solid #888; padding:4px 8px; }
  .face { font-size:64px; margin:8px 0; }
  h1 { font-size:34px; font-weight:700; letter-spacing:.18em; color:var(--gold2); }
  .alias { font-size:13px; color:var(--dim); letter-spacing:.12em; margin:8px 0 6px; }
  .real { font-size:14px; color:#c9b896; margin-bottom:16px; }
  .charts { display:grid; grid-template-columns: 1fr 1fr; gap:16px; margin:18px 0; }
  @media (max-width:640px){ .charts{ grid-template-columns:1fr; } }
  .box { border:1px solid rgba(212,168,75,0.25); background:rgba(0,0,0,0.25); padding:12px; }
  .box h3 { font-size:11px; letter-spacing:.2em; color:var(--gold); margin-bottom:8px; text-align:center; }
  h2 { font-size:13px; letter-spacing:.2em; color:var(--gold); margin:22px 0 8px; border-left:3px solid #888; padding-left:8px; }
  p, li { font-size:14px; line-height:1.7; color:#e6d8b8; }
  ul { padding-left:18px; }
  .quote { border-left:3px solid #888; padding:8px 12px; margin:8px 0; background:rgba(255,255,255,0.04); font-size:13px; color:#ddd; }
  footer { margin-top:26px; text-align:center; font-size:11px; color:var(--dim); }
  footer a { color:var(--gold2); text-decoration:none; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 群英榜</a>
  <div class="panel">
    <div class="seal">廖</div>
    <div class="top"><div class="pwr">82</div><div class="star-tag">地健星 · BENCH</div></div>
    <div class="face">🍜</div>

    <div class="charts">
      <div class="box">

        <svg viewBox="0 0 220 140" width="100%" height="140">
          <rect width="220" height="140" fill="#080706"/>
          <g fill="#ccc">
            <circle cx="50" cy="90" r="3"/><circle cx="110" cy="55" r="4"/><circle cx="170" cy="100" r="2.5"/>
          </g>

      <div class="box">

            <polygon points="110,30 178,70 178,130 110,150 42,130 42,70"/>
          </g>
          <g stroke="#2a2418" stroke-width="1">
            <line x1="110" y1="110" x2="110" y2="30"/><line x1="110" y1="110" x2="178" y2="70"/>
            <line x1="110" y1="110" x2="178" y2="130"/><line x1="110" y1="110" x2="110" y2="150"/>
            <line x1="110" y1="110" x2="42" y2="130"/><line x1="110" y1="110" x2="42" y2="70"/>
          </g>
          <!-- FOOD85 FLEX80 SHOW78 FAM75 STK72 NEWS70 -->
          <polygon points="110,45 155,85 152,122 110,138 68,118 70,85" fill="rgba(255,255,255,0.08)" stroke="#aaa" stroke-width="1.2"/>
          <g fill="#c9b896" font-size="9" text-anchor="middle">
            <text x="110" y="18">頻度</text><text x="198" y="68">飲饌</text>
            <text x="198" y="138">彈性</text><text x="110" y="168">直播</text>
            <text x="20" y="138">親族</text><text x="20" y="68">市況</text>
          </g>
        </svg>
      </div>
    </div>

    <h2>列傳</h2>
    <p>低調輪換。街市情報、改期、Pun 直播——短而實。不搶風頭，然飯局少了他，常散。</p>

    <h2>絕技</h2>

      <li><b>街市諜報</b> — 楊屋道新開情報</li>
      <li><b>鳴金收兵</b> — 「建議唔買1至20」</li>

    <h2>陣前語</h2>
    <div class="quote">建議唔買1至20</div>
    <div class="quote">依家楊屋道街市開咗間</div>
    <div class="quote">Pun直播緊😅😑</div>
  </div>
  <footer><a href="index.html">回到群英榜</a> · MIMO 軍師批</footer>
</div>
</body>
</html>
