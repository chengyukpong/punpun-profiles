<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GHOST TRIO // FA</title>
<style>
  :root { --gold:#f5c542; --cyan:#3de7ff; --bg:#050508; --ink:#e8f6ff; --dim:#7a8a99; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background: radial-gradient(900px 500px at 50% 0%, rgba(255,255,255,0.05), transparent 55%), var(--bg);
    color:var(--ink);
    font-family:"Segoe UI","PingFang HK","Microsoft JhengHei",sans-serif;
    min-height:100vh; padding:28px 16px 50px;
  }
  .wrap { max-width:720px; margin:0 auto; }
  .back { color:var(--cyan); text-decoration:none; font-size:12px; letter-spacing:0.12em; }
  .panel {
    margin-top:16px;
    background: linear-gradient(155deg,#101010,#0a0a10 60%);
    border:1px dashed rgba(255,255,255,0.2);
    border-radius:6px; padding:24px 22px 28px;
    position:relative; overflow:hidden;
  }
  .top { display:flex; justify-content:space-between; align-items:flex-start; }
  .ovr { font-size:72px; font-weight:900; color:#666; line-height:1; }
  .pos { font-size:14px; letter-spacing:0.2em; color:#999; border:1px solid #555; padding:4px 10px; }
  .emoji { font-size:72px; margin:8px 0; }
  h1 { font-size:32px; font-weight:800; }
  .tag { color:var(--gold); font-size:13px; letter-spacing:0.12em; margin:6px 0 18px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; margin:16px 0 22px; }
  .stat { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07); padding:10px 8px; text-align:center; border-radius:3px; }
  .stat .v { font-size:22px; font-weight:800; color:#aaa; }
  .stat .k { font-size:10px; color:var(--dim); letter-spacing:0.14em; margin-top:4px; }
  h2 { font-size:13px; letter-spacing:0.2em; color:var(--cyan); margin:22px 0 8px; border-left:3px solid var(--gold); padding-left:8px; }
  p, li { font-size:14px; line-height:1.65; color:#c8d0d8; }
  ul { padding-left:18px; }
  footer { margin-top:28px; font-size:11px; color:var(--dim); text-align:center; }
  footer a { color:var(--cyan); }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← ROSTER</a>
  <div class="panel">
    <div class="top"><div class="ovr">??</div><div class="pos">FA</div></div>
    <div class="emoji">👻</div>
    <h1>GHOST TRIO</h1>
    <div class="tag">未激活節點 · 3 人 · 樣本不足</div>

    <div class="grid">
      <div class="stat"><div class="v">6</div><div class="k">…2957</div></div>
      <div class="stat"><div class="v">92</div><div class="k">…1250</div></div>
      <div class="stat"><div class="v">1</div><div class="k">…7983</div></div>
    </div>

    <h2>STATUS</h2>
    <ul>
      <li><b>…9644-1250</b>：92 則。出現過「時代結束」「我哋的青春」「人生有輸有勝」——像沉默觀察者，偶爾詩意收束。</li>
      <li><b>…9644-2957</b>：6 則。幾乎隱形。</li>
      <li><b>…9879-7983</b>：1 則。自由球員名單。</li>
    </ul>

    <h2>NOTE</h2>
    <p>人數齊 10，但本檔 7 個月內真正打主力的是前六人。若群友幫忙對名字／綽號，可補卡。</p>
  </div>
  <footer>MIMO CARDS · <a href="index.html">回到名單</a></footer>
</div>
</body>
</html>
