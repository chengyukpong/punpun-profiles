<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>隱將 · 未入陣</title>
<style>
  :root { --gold:#d4a84b; --gold2:#f0d78c; --bg:#0b0a08; --ink:#c8c0b0; --dim:#6a6050; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background: var(--bg); color:var(--ink); font-family:"Songti SC","Noto Serif SC","PMingLiU",serif; min-height:100vh; padding:28px 16px 50px; }
  .wrap { max-width:760px; margin:0 auto; }
  .back { color:var(--gold2); text-decoration:none; font-size:12px; letter-spacing:.15em; }
  .panel { margin-top:14px; background:#0e0e10; border:1px dashed rgba(255,255,255,0.2); padding:26px 22px 30px; }
  h1 { font-size:32px; font-weight:700; letter-spacing:.18em; color:var(--gold2); }
  .alias { font-size:13px; color:var(--dim); margin:8px 0 16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin:18px 0; }
  .ghost { border:1px solid #333; padding:14px; text-align:center; background:#0a0a0c; }
  .ghost .n { font-size:28px; color:#666; font-weight:700; }
  .ghost .t { font-size:11px; color:#777; margin-top:6px; letter-spacing:.1em; }
  h2 { font-size:13px; letter-spacing:.2em; color:var(--gold); margin:22px 0 8px; border-left:3px solid #555; padding-left:8px; }
  p, li { font-size:14px; line-height:1.7; color:#c8c0b0; }
  ul { padding-left:18px; }
  footer { margin-top:26px; text-align:center; font-size:11px; color:var(--dim); }
  footer a { color:var(--gold2); text-decoration:none; }
</style>
</head>
<body>
<div class="wrap">

  </div>
